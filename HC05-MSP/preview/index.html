*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#203039;font:14px 'Segoe UI','Microsoft YaHei',sans-serif}button{font:inherit;cursor:pointer;border:0}button:disabled{opacity:.45;cursor:default}header{padding:22px 32px;background:white;display:flex;justify-content:space-between;border-bottom:1px solid #dbe3e7}header span{font-size:12px;color:#809099}main{max-width:1320px;margin:32px auto;padding:0 24px;display:grid;grid-template-columns:230px 1fr;gap:30px}aside h1{font-size:29px;line-height:1.5}aside p,small{color:#7b8a94;line-height:1.9}.eyebrow{font-size:11px;letter-spacing:2px;color:#176d67;font-weight:700}.choices{display:flex;gap:8px;margin:24px 0}.choices button{padding:10px 16px;background:white;border-radius:8px}.choices .active{background:#244342;color:white}.stage{display:flex;justify-content:center;align-items:flex-start}.phone{width:410px;max-width:100%;border:8px solid #21333b;border-radius:38px;background:#f6f8fa;overflow:hidden;box-shadow:0 24px 60px #172f3920}.wide .phone{width:880px;border-radius:28px}.top{display:flex;justify-content:space-between;padding:12px 23px 0;font-size:11px}.screen{padding:23px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}h2{font-size:23px;margin:0}.muted,.sub{font-size:12px;color:#86959e;line-height:1.8}.sub{margin-top:6px}.badge{font-size:11px;padding:7px 10px;background:#e5efed;border-radius:30px;color:#176d67;white-space:nowrap}.card{padding:20px;background:white;border:1px solid #e3e9ed;border-radius:17px;margin-top:17px}.primary{background:#176d67;color:white;width:100%;padding:14px;border-radius:11px;font-weight:600}.secondary{background:#eaf0f1;color:#46636b;padding:12px;border-radius:10px}.intro{text-align:center;padding:35px 0 18px}.icon{width:74px;height:74px;border-radius:24px;background:#e5efed;margin:0 auto 23px;display:grid;place-items:center;font-size:33px;color:#176d67}.device{padding:16px 0;border-bottom:1px solid #eef2f4;margin-bottom:16px}.footnote{font-size:11px;color:#99a5ac;text-align:center;margin-top:22px;line-height:1.8}.nav{display:flex;gap:5px;background:#e9eef1;padding:4px;border-radius:11px;margin:21px 0 0}.nav button{flex:1;padding:10px;border-radius:8px;background:transparent;color:#819099}.nav .active{background:white;color:#176d67;font-weight:600}.metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;background:white;border:1px solid #e3e9ed;border-radius:14px;padding:13px;text-align:center}.metrics b{display:block;font-size:19px;font-weight:500}.metrics span{font-size:10px;color:#8a989f}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.stick{text-align:center;min-width:0}.stick-title{font-size:12px;font-weight:600;margin-bottom:15px}.joystick{width:140px;height:140px;max-width:100%;border:1px solid #d8e2e5;border-radius:50%;background:radial-gradient(circle,#fff,#eff4f5);position:relative;margin:auto;touch-action:none;user-select:none}.joystick:before,.joystick:after{content:'';position:absolute;background:#d8e3e6;pointer-events:none}.joystick:before{height:1px;left:12%;right:12%;top:50%}.joystick:after{width:1px;top:12%;bottom:12%;left:50%}.knob{position:absolute;width:48px;height:48px;border-radius:50%;background:#327f78;border:5px solid white;box-shadow:0 4px 12px #1d575233;left:calc(50% - 24px);top:calc(50% - 24px);z-index:1;pointer-events:none}.caption{margin-top:14px;font-size:10px;line-height:1.9;color:#8d9aa2}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#faecea;color:#b7564c;padding:13px;border-radius:11px}.status-line{padding:13px 0;border-bottom:1px solid #eef1f3;display:flex;justify-content:space-between;font-size:13px}.notice{padding:12px 14px;background:#edf3f2;color:#6d8581;line-height:1.8;font-size:11px;border-radius:10px;margin-top:17px}.wide .joystick{width:190px;height:190px}.wide .controls{gap:100px;padding:0 55px}.wide .metrics,.wide .actions{max-width:460px;margin:18px auto}.wide .connect-page,.wide .status-card{max-width:430px;margin:auto}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#213e40;color:white;border-radius:12px;padding:13px 22px;display:none;z-index:10}@media(max-width:850px){main{grid-template-columns:1fr}aside h1 br{display:none}header span{display:none}.wide .controls{padding:0;gap:20px}}

body{background:#f6f8fa} .screen{padding:22px 22px 30px;max-width:1100px;margin:auto} .icon{background:transparent} .icon img{width:84px;height:84px;border-radius:23px} .connect-page{max-width:430px;margin:auto;padding-top:12px} .actions{max-width:460px;margin:20px auto} .metrics{max-width:500px;margin:18px auto} .status-card{max-width:650px;margin:17px auto}.controls{margin:32px 0}.notice{max-width:650px;margin:20px auto 0}@media(orientation:landscape){.controls{padding:0 35px;gap:100px}.joystick{width:180px;height:180px}.intro{padding:10px 0}.screen{padding-top:15px}}@media(min-width:420px){.joystick{width:170px;height:170px}}

html,body{width:100%;height:100%;overflow:hidden}body{overscroll-behavior:none}.screen{height:100dvh;width:100%;max-width:none;padding:12px max(22px,env(safe-area-inset-right)) 10px max(22px,env(safe-area-inset-left));overflow:auto}.screen.control{overflow:hidden;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:40px 38px minmax(0,1fr) 38px;gap:6px 20px}.control>.row{grid-column:1;grid-row:1}.control h2{font-size:19px}.control .sub{display:none}.control>.nav{grid-column:2;grid-row:1;margin:0;align-self:center}.control>.metrics{grid-column:1/-1;grid-row:2;margin:0 auto;width:380px;padding:3px;border:0;background:transparent}.control .metrics b{font-size:17px}.control .metrics span{font-size:10px}.control>.controls{grid-column:1/-1;grid-row:3;margin:0;padding:0 6%;gap:18%;min-height:0}.control .stick{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}.control .stick-title{margin:0 0 5px}.control .joystick{width:clamp(90px,calc(100dvh - 190px),230px);height:auto;aspect-ratio:1;flex-shrink:0}.control .caption{margin:5px 0 0;line-height:1.4;white-space:nowrap}.control>.actions{grid-row:4;grid-column:1/-1;display:flex;align-items:center;justify-content:center;width:100%;margin:0;max-width:none}.control .actions button{padding:8px 22px;font-size:12px}.control>.notice{display:none}.control .badge{padding:5px 8px}.toast{font-size:12px;padding:9px 14px;bottom:8px;max-width:80%;text-align:center}.status-card{margin-top:10px}.screen:not(.control) .connect-page{padding:0;max-width:620px;display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}.connect-page>.row{grid-column:1/-1}.connect-page .intro{grid-column:1;grid-row:2/6;padding:10px 0}.connect-page .card{grid-column:2;grid-row:2;margin:0;padding:14px}.connect-page>.secondary{grid-column:2;margin:0!important}.connect-page .footnote{grid-column:1/-1;margin:0}.intro .icon{margin-bottom:12px}.intro h2{font-size:21px}
</style></head><body><div class="screen" id="screen"></div><div class="toast" id="toast"></div><script>
let connected=false,page='control',timer,demo=false,live={};const screen=document.querySelector('#screen');
function notify(s){const t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(timer);timer=setTimeout(()=>t.style.display='none',2600)}
function layout(w,b){document.querySelector('#stage').classList.toggle('wide',w);document.querySelectorAll('.choices button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function connect(){if(window.Native){notify('请选择已配对设备');Native.connect()}else startDemo()}
function startDemo(){if(live.connected){notify('先断开真实设备再进入演示');return}demo=true;connected=true;page='control';render();notify('交互演示，不发送操纵指令')}
function nativeEvent(e){if(e==='connected'){demo=false;connected=true;page='control';render()}if(e==='disconnected'){connected=false;demo=false;render()}}
function nativeData(d){const stopped=live.testing&&!d.testing;live=d;if(stopped)reset();if(!demo&&connected)refresh()}
function refresh(){for(const [key,id] of [['roll','metric-roll'],['pitch','metric-pitch']]){const el=document.getElementById(id);if(el)el.textContent=live.fresh&&live[key]!=null?Number(live[key]).toFixed(1)+'°':'—'}const v=document.getElementById('metric-voltage');if(v)v.textContent=live.fresh&&live.voltage!=null?live.voltage.toFixed(1)+' V':'— V';const b=document.getElementById('badge');if(b)b.textContent=live.fresh?'● 飞控有应答':'● 等待飞控应答';const toggle=document.getElementById('test-toggle');if(toggle)toggle.textContent=live.testing?'停止通道测试':'开始无电机通道测试';const values={device:'HC-05 / SPP',link:live.connected?'已连接':'未连接',reply:live.fresh?'正常':'无应答',board:live.board||'—',version:live.version||'—',baro:live.baro===true?'已检测':live.baro===false?'未检测':'—',altitude:live.fresh&&live.baro&&live.altitude!=null?live.altitude.toFixed(2)+' m（估计）':'—',voltage:live.fresh&&live.voltage!=null?live.voltage.toFixed(1)+' V':'—',control:live.testing?'方向通道测试 · 油门1000':'测试未开启',channels:live.fresh&&live.channels?live.channels.join(' / '):'—'};for(const k in values){const el=document.getElementById('s-'+k);if(el)el.textContent=values[k]}const l=document.getElementById('logs');if(l)l.textContent=live.log||'暂无日志'}

function disconnect(){if(!demo&&window.Native)Native.disconnect();demo=false;connected=false;render()}
function go(p){if(window.Native)Native.page(p==='control');page=p;render()}
function render(){screen.classList.toggle('control',connected&&page==='control');if(!connected){screen.innerHTML=`<div class="connect-page"><div class="row"><strong>LFish · 青鳍</strong><span class="muted">手机控制端</span></div><div class="intro"><div class="icon"><img src="app-icon.png" alt="LFish · 青鳍"></div><h2>连接你的飞控</h2><p class="muted">打开蓝牙，为飞控和 HC-05 上电<br>选择已配对设备即可开始</p></div><div class="card"><div class="muted">经典蓝牙设备</div><div class="device row"><div><strong>HC-05</strong><div class="sub">经典蓝牙 · SPP</div></div><span class="badge">待选择</span></div><button class="primary" onclick="connect()">选择并连接 HC-05</button></div><button class="secondary" style="width:100%;margin-top:13px" onclick="notify('请先在系统设置 → 蓝牙中配对 HC-05，再返回选择设备')">找不到设备？查看连接帮助</button><button class="secondary" style="width:100%;margin-top:12px" onclick="startDemo()">先体验控制界面（演示）</button><div class="footnote">首次使用请在系统蓝牙设置中配对<br>仅请求蓝牙权限，无需账号或网络</div></div>`;return;}
screen.innerHTML=`<div class="row"><div><h2>${page==='control'?'飞行控制':'连接状态'}</h2><div class="sub">${demo?'交互演示 · 不连接硬件':'HC-05 / MSP v1'}</div></div><span class="badge" id="badge">${demo?'● 演示模式':'● 等待飞控应答'}</span></div><div class="nav"><button class="${page==='control'?'active':''}" onclick="go('control')">控制</button><button class="${page==='status'?'active':''}" onclick="go('status')">连接状态</button></div>`;
if(page==='status'){screen.innerHTML+=`<div class="card status-card"><strong>设备与通信</strong>${[['蓝牙设备','device'],['蓝牙链路','link'],['飞控应答','reply'],['飞控型号','board'],['固件版本','version'],['气压计','baro'],['相对高度','altitude'],['电池电压','voltage'],['控制状态','control'],['接收通道','channels']].map(x=>`<div class="status-line"><span class="muted">${x[0]}</span><span id="s-${x[1]}" style="max-width:60%;overflow-wrap:anywhere">${demo?'演示数据':'—'}</span></div>`).join('')}<button class="danger" style="width:100%;margin-top:17px" onclick="disconnect()">断开连接</button></div><div class="notice">校准和参数调整在 Betaflight 完成。气压高度为估计值，USB 供电时电压不代表电池状态。<details style="margin-top:12px"><summary>通信日志</summary><pre id="logs" style="white-space:pre-wrap"></pre></details></div>`;if(!demo)refresh();return;}
screen.innerHTML+=`<div class="metrics"><div><b id="metric-roll">${demo?'0.0°':'—'}</b><span>横滚</span></div><div><b id="metric-pitch">${demo?'0.0°':'—'}</b><span>俯仰</span></div><div><b id="metric-voltage">— V</b><span>电池电压</span></div></div><div class="controls"><div class="stick"><div class="stick-title">${demo?'升降 / 转向':'转向 · 升降锁定'}</div><div class="joystick" id="left"><div class="knob"></div></div><div class="caption">升降 <span id="throttle">保持高度</span> · 转向 <span id="yaw">1500</span><br>${demo?'升降为未来定高交互演示':'油门固定1000 · AUX固定1000'}</div></div><div class="stick"><div class="stick-title">前后 / 左右</div><div class="joystick" id="right"><div class="knob"></div></div><div class="caption">俯仰 <span id="pitch">1500</span> · 横滚 <span id="roll">1500</span><br>松手回中</div></div></div><div class="actions">${demo?'<button class="secondary" disabled>解锁／定高待实现</button>':'<button class="primary" id="test-toggle" style="width:auto" onclick="toggleTest()">开始无电机通道测试</button><span class="muted">　解锁与升降关闭</span>'}</div><div class="notice">目标交互：松手回中保持高度。定高控制尚未实现，当前不发送指令；右杆回中不代表水平定点。上锁仅用于接地后停机或紧急停机。</div>`;bind('left');bind('right');reset();if(!demo)refresh();}
let input={roll:1500,pitch:1500,yaw:1500};function toggleTest(){if(window.Native)Native.testing(!live.testing)}
function set(id,x,y){if(!demo&&id==='left')y=0;const el=document.querySelector('#'+id);if(!el)return;el.querySelector('.knob').style.transform=`translate(${x*el.clientWidth*.30}px,${-y*el.clientWidth*.30}px)`;if(id==='left'){document.querySelector('#throttle').textContent=(!demo?'锁定 / 1000':y>.08?'上升 '+Math.round(y*100)+'%':y<-.08?'下降 '+Math.round(-y*100)+'%':'保持高度');document.querySelector('#yaw').textContent=Math.round(1500+x*(demo?500:100))}else{document.querySelector('#pitch').textContent=Math.round(1500+y*(demo?500:100));document.querySelector('#roll').textContent=Math.round(1500+x*(demo?500:100))}}
setInterval(()=>{if(connected&&!demo&&live.testing&&page==='control'&&document.getElementById('roll')&&window.Native){Native.sticks(Number(document.getElementById('roll').textContent),Number(document.getElementById('pitch').textContent),Number(document.getElementById('yaw').textContent))}},80);
document.addEventListener('visibilitychange',()=>{if(document.hidden){reset();if(window.Native)Native.testing(false)}});window.addEventListener('blur',()=>reset());
function reset(){set('left',0,0);set('right',0,0)}
function bind(id){const el=document.querySelector('#'+id);let pointer=null;function move(e){if(e.pointerId!==pointer)return;const b=el.getBoundingClientRect(),r=el.clientWidth*.30;set(id,Math.max(-1,Math.min(1,(e.clientX-b.left-b.width/2)/r)),Math.max(-1,Math.min(1,-(e.clientY-b.top-b.height/2)/r)))}el.onpointerdown=e=>{if(!demo&&!live.testing){notify('先点开始无电机通道测试');return}if(pointer!==null)return;pointer=e.pointerId;el.setPointerCapture(pointer);move(e)};el.onpointermove=move;function release(e){if(e.pointerId!==pointer)return;pointer=null;set(id,0,0)}el.onpointerup=release;el.onpointercancel=release;el.onlostpointercapture=release;}
render();
</script></body></html>
